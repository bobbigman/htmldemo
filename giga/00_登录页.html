<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 · 金蝶×AMOS演示</title>
<link rel="stylesheet" href="common.css">
<style>
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,#1f2430 0%,#1a5cb9 55%,#eef4fc 55%)}
.box{width:380px;background:#fff;border-radius:8px;padding:28px;box-shadow:0 12px 40px rgba(0,0,0,.18)}
.box h1{font-size:18px;margin-bottom:6px}
.box p{color:#8a94a0;margin-bottom:18px;line-height:1.6}
.box label{display:block;color:#666;margin:10px 0 4px}
.box input{width:100%;padding:8px 10px;border:1px solid #d0d5dd;border-radius:4px}
</style>
</head>
<body>
<div class="login-wrap">
  <div class="box">
    <h1>金蝶 × AMOS 采购对接</h1>
    <p>静态演示账号，用于项目会议字段确认。不接真实账套。</p>
    <label>账套</label>
    <input type="text" value="演示账套 / DEMO">
    <label>用户</label>
    <input type="text" value="会议演示员">
    <label>密码</label>
    <input type="password" value="******">
    <div style="margin-top:18px">
      <button class="btn p" style="width:100%" type="button" onclick="location.href='index.html'">进入演示</button>
    </div>
  </div>
</div>
</body>
</html>
